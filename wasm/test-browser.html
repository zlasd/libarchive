<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>libarchive password WASM browser test</title>
  </head>
  <body data-result="pending">
    <script type="module">
      const worker = new Worker("./test-browser-worker.mjs", {
        type: "module",
      });
      const timeout = setTimeout(() => {
        document.body.dataset.result = "failed";
        document.body.textContent += " | timed out";
      }, 10000);
      worker.onmessage = ({ data }) => {
        if (data.progress) {
          document.body.textContent = data.progress;
          return;
        }
        clearTimeout(timeout);
        document.body.dataset.result = data.ok ? "passed" : "failed";
        document.body.textContent = data.ok ? "passed" : data.error;
        worker.terminate();
      };
      worker.onerror = ({ message }) => {
        clearTimeout(timeout);
        document.body.dataset.result = "failed";
        document.body.textContent = message;
      };
    </script>
  </body>
</html>
